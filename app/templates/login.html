{% extends "base.html" %} {% block content %}
<div class="bg-white p-6 rounded-lg shadow-md mt-6">
  <h2 class="text-2xl font-bold mb-4 text-green-700">
    Identificação do Operador
  </h2>
  <form action="/scale" method="GET" class="space-y-4">
    <div>
      <label class="block font-semibold mb-2">CPF do Operador:</label>
      <input
        type="text"
        name="cpf"
        placeholder="000.000.000-00"
        required
        class="w-full p-4 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-green-600"
      />
    </div>
    <div>
      <label class="block font-semibold mb-2">Senha:</label>
      <input
        type="password"
        name="password"
        placeholder="••••••••"
        required
        class="w-full p-4 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-green-600"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-green-600 text-white font-bold py-4 rounded-lg text-xl hover:bg-green-700 transition"
    >
      Entrar no Sistema
    </button>
  </form>
</div>
{% endblock %}
