{% extends "base.html" %} {% block content %}
<div class="bg-white p-6 rounded-xl shadow-lg mt-4 border border-green-100">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-extrabold text-green-800">Registro de Pesagem</h2>
    <span
      class="text-xs bg-green-100 text-green-800 font-semibold px-2.5 py-1 rounded-full"
      >Posto 01</span
    >
  </div>

  <!-- Container de feedback de usabilidade / erros operacionais -->
  <div
    id="feedback-alert"
    class="hidden mb-4 p-4 bg-amber-50 border-l-4 border-amber-500 text-amber-700 text-sm rounded"
  >
    <strong>Atenção:</strong> Verifique se o peso digitado é superior a 0 kg e
    se todos os campos obrigatórios estão preenchidos.
  </div>

  <form action="/receipt" method="POST" class="space-y-5">
    <div>
      <label class="block font-bold text-gray-700 mb-2"
        >Nome do Cooperado / Catador:</label
      >
      <input
        type="text"
        name="coop_name"
        placeholder="Ex: Maria das Dores"
        required
        class="w-full p-4 border-2 border-gray-300 rounded-xl text-lg focus:outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
      />
    </div>

    <div>
      <label class="block font-bold text-gray-700 mb-2"
        >Categoria do Material:</label
      >
      <select
        name="material_category"
        class="w-full p-4 border-2 border-gray-300 rounded-xl text-lg bg-white focus:outline-none focus:border-green-600"
      >
        <option value="Papelão Ondulado">
          📦 Papelão Ondulado (R$ 0,50/kg)
        </option>
        <option value="Plástico PET">🧴 Plástico PET (R$ 1,80/kg)</option>
        <option value="Alumínio">🥫 Alumínio (R$ 6,50/kg)</option>
        <option value="Vidro">🍾 Vidro (R$ 0,20/kg)</option>
      </select>
    </div>

    <div>
      <label class="block font-bold text-gray-700 mb-2"
        >Peso Líquido na Balança (kg):</label
      >
      <input
        type="number"
        step="0.01"
        min="0.01"
        max="10000"
        name="weight_kg"
        placeholder="0.00"
        required
        class="w-full p-4 border-2 border-gray-300 rounded-xl text-lg focus:outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
      />
      <p class="text-xs text-gray-500 mt-1">
        Insira o valor decimal exato medido na balança digital.
      </p>
    </div>

    <input type="hidden" name="operator_cpf" value="123.456.789-00" />

    <!-- Alvo tátil ampliado (altura h-16 / py-4) para operação facilitada no galpão -->
    <button
      type="submit"
      class="w-full bg-green-600 text-white font-bold py-4 rounded-xl text-xl hover:bg-green-700 active:bg-green-800 shadow-md transition transform active:scale-98"
    >
      Registrar e Emitir Recibo
    </button>
  </form>
</div>
{% endblock %}
