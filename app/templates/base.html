<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Associação de Reciclagem - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between"
  >
    <header class="bg-green-700 text-white p-4 shadow-md">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold">♻️ Reciclagem MVP - Galpão</h1>
        <span class="text-sm bg-green-800 px-3 py-1 rounded"
          >Operador Ativo</span
        >
      </div>
    </header>

    <main class="container mx-auto p-4 flex-grow max-w-2xl">
      {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white text-center p-3 text-sm">
      Associação de Reciclagem &copy; 2026 — Alinhado ao ODS 8
    </footer>
  </body>
</html>
